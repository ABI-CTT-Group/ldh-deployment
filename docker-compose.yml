services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    stop_grace_period: 1m30s
    env_file:
      - docker-compose.env
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - db:/var/lib/mysql

  seek:
    image: ghcr.io/nfdi4health/ldh:${LDH_RELEASE:-latest}
    command: docker/entrypoint.sh
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      NO_ENTRYPOINT_WORKERS: 1
      # for proxy redirect
      RAILS_RELATIVE_URL_ROOT: "/seek"
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      SEEK_KEYCLOAK_CLIENT_SECRET: ${SEEK_KEYCLOAK_CLIENT_SECRET}
      PLATFORM_PROTOCOL: ${PLATFORM_PROTOCOL:-http}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    extra_hosts:
      - "${PLATFORM_DOMAIN:-localhost}:host-gateway"
    env_file:
      - docker-compose.env
    volumes:
      - filestore:/seek/filestore
      - cache:/seek/tmp/cache
      - ./${NGINX_CONF:-nginx.conf.http}:/seek/docker/nginx.conf.template
      - ./${DHO_TERMS:-standard}.en.yml:/seek/config/locales/overrides/dho-terms.en.yml
      - ./keycloak_oidc.rb:/seek/config/initializers/keycloak_oidc.rb:ro
      - ./keycloak_jwt_auth.rb:/seek/config/initializers/keycloak_jwt_auth.rb:ro
    ports:
      - ${SEEK_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/seek/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    links:
      - db
      - solr

  workers:
    image: ghcr.io/nfdi4health/ldh:${LDH_RELEASE:-latest}
    command: docker/start_workers.sh
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      # for proxy redirect
      RAILS_RELATIVE_URL_ROOT: "/seek"
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      SEEK_KEYCLOAK_CLIENT_SECRET: ${SEEK_KEYCLOAK_CLIENT_SECRET}
      PLATFORM_PROTOCOL: ${PLATFORM_PROTOCOL:-http}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    extra_hosts:
      - "${PLATFORM_DOMAIN:-localhost}:host-gateway"
    env_file:
      - docker-compose.env
    volumes:
      - filestore:/seek/filestore
      - cache:/seek/tmp/cache
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[d]elayed_job' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    links:
      - db
      - solr

  solr:
    image: fairdom/seek-solr:8.11
    restart: unless-stopped
    environment:
      SOLR_JAVA_MEM: -Xms512m -Xmx1024m
      GC_TUNE: "-XX:-UseLargePages"
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
    volumes:
      - solr:/var/solr/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/admin/info/system >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - seek
      - /opt/solr/server/solr/configsets/seek_config

volumes:
  filestore:
    name: ${PROJECT_NAME}_seek_filestore
    external: false
    driver: local
  db:
    name: ${PROJECT_NAME}_seek_db
    external: false
    driver: local
  solr:
    name: ${PROJECT_NAME}_seek_solr
    external: false
    driver: local
  cache:
    name: ${PROJECT_NAME}_seek_cache
    external: false
    driver: local
